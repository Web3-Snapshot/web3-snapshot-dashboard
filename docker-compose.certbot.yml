name: web3-snapshot

services:
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot/:rw
      - certbot_conf:/etc/letsencrypt/:rw
      - /var/log/letsencrypt/:/var/log/letsencrypt
    networks:
      - w3s-nw

  nginx80:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      # Path configured by deployment script on server
      - /opt/web3-snapshot/compose/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot/:ro
      - certbot_conf:/etc/letsencrypt/:ro
    networks:
      - w3s-nw

volumes:
  certbot_www:
  certbot_conf:

networks:
  w3s-nw:
