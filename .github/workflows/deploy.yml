name: Build and Push to ECR

on:
  push:
    branches: [main, feature/ecr-deployment-setup]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Build images
          docker build -t w3s-database:latest ./database
          docker build -t w3s-backend:latest ./backend
          docker build -t w3s-frontend:latest ./frontend

          # Tag for ECR
          docker tag w3s-database:latest $ECR_REGISTRY/w3s-database:latest
          docker tag w3s-backend:latest $ECR_REGISTRY/w3s-backend:latest
          docker tag w3s-frontend:latest $ECR_REGISTRY/w3s-frontend:latest

          # Push to ECR
          docker push $ECR_REGISTRY/w3s-database:latest
          docker push $ECR_REGISTRY/w3s-backend:latest
          docker push $ECR_REGISTRY/w3s-frontend:latest
