name: Build and Push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push multi-platform images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Build and push multi-platform images
          docker buildx build --platform linux/amd64,linux/arm64 -t $ECR_REGISTRY/w3s-database:latest ./database --push
          docker buildx build --platform linux/amd64,linux/arm64 -t $ECR_REGISTRY/w3s-backend:latest ./backend --push
          docker buildx build --platform linux/amd64,linux/arm64 -t $ECR_REGISTRY/w3s-frontend:latest ./frontend --push

      - name: Update SSM Parameters
        run: |
          # Store individual environment variables in SSM
          aws ssm put-parameter --name "/w3s/production/redis-url" --value "redis://redis:6379/0" --type "String" --overwrite
          aws ssm put-parameter --name "/w3s/production/coingecko-api-url" --value "${{ secrets.COINGECKO_API_URL }}" --type "String" --overwrite
          aws ssm put-parameter --name "/w3s/production/coingecko-api-key" --value "${{ secrets.COINGECKO_API_KEY }}" --type "SecureString" --overwrite
          aws ssm put-parameter --name "/w3s/production/aws-account" --value "${{ secrets.AWS_ACCOUNT_ID }}" --type "String" --overwrite
          aws ssm put-parameter --name "/w3s/production/aws-region" --value "${{ secrets.AWS_REGION }}" --type "String" --overwrite
          aws ssm put-parameter --name "/w3s/production/domain" --value "web3snapshot.loxosceles.me" --type "String" --overwrite
          aws ssm put-parameter --name "/w3s/production/email" --value "${{ secrets.CERTIFICATE_EMAIL }}" --type "String" --overwrite
          aws ssm put-parameter --name "/w3s/production/s3-deployment-bucket" --value "${{ secrets.S3_DEPLOYMENT_BUCKET }}" --type "String" --overwrite

      - name: Upload configuration files to S3
        run: |
          # Upload files to S3 deployment bucket
          aws s3 cp docker-compose.production.yml s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/production/docker-compose.production.yml
          aws s3 cp docker-compose.certbot.yml s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/production/docker-compose.certbot.yml
          aws s3 cp database/schema.sql s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/production/schema.sql
          aws s3 cp backend/.env_TEMPLATE s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/production/backend.env
          aws s3 cp scripts/deploy-production.sh s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/scripts/deploy-production.sh
          aws s3 cp scripts/renew-certificate.sh s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/scripts/renew-certificate.sh
          aws s3 cp nginx/default.conf s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/production/nginx-default.conf
