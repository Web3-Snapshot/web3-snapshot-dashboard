name: web3-snapshot

services:
  data_fetcher:
    container_name: web3_data_fetcher_prod
    init: true
    restart: always
    image: ${DOCKER_IMAGE_DATA_FETCHER}
    # Path configured by deployment script on server
    env_file: /opt/web3-snapshot/config/.env.production
    volumes:
      - /var/log:/var/log
    networks:
      - w3s-inner-nw

  backend:
    container_name: web3_backend_prod
    image: ${DOCKER_IMAGE_BACKEND}
    # Paths configured by deployment script on server
    env_file:
      - /opt/web3-snapshot/config/.env.production
      - /opt/web3-snapshot/config/backend/.env
    restart: always
    depends_on:
      - data_fetcher
    networks:
      - w3s-inner-nw
      - w3s-nw

  frontend:
    container_name: web3_frontend_prod
    image: ${DOCKER_IMAGE_FRONTEND}
    # Path configured by deployment script on server
    env_file: /opt/web3-snapshot/config/.env.production
    ports:
      - 443:443
    restart: always
    depends_on:
      - backend
    links:
      - backend
    volumes:
      - certbot_www:/var/www/certbot/:ro
      - certbot_conf:/etc/letsencrypt
    networks:
      - w3s-nw

  redis:
    container_name: web3_redis_prod
    hostname: redis
    restart: always
    image: redis:7.2-alpine
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - 6379
    networks:
      - w3s-inner-nw

  certificate_renewal:
    container_name: web3_certificate_renewal_prod
    image: alpine:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/web3-snapshot/scripts:/opt/web3-snapshot/scripts:ro
      - /opt/web3-snapshot/compose:/opt/web3-snapshot/compose:ro
      - /opt/web3-snapshot/config:/opt/web3-snapshot/config:ro
      - /var/log:/var/log
      - certbot_conf:/etc/letsencrypt
    command: |
      sh -c "
      apk add --no-cache docker-cli docker-compose cronie &&
      (echo '0 2,14 * * * sh /opt/web3-snapshot/scripts/manage-certificate.sh >> /var/log/certificate-renewal.log 2>&1'; echo '0 0 */100 * * find /var/log -name "certificate-renewal.log" -exec truncate -s 0 {} \;') | crontab - &&
      crond -f
      "
    networks:
      - w3s-nw

volumes:
  certbot_www:
  certbot_conf:

networks:
  w3s-nw:
  w3s-inner-nw:
